# ── 跨公司的兜底源 ────────────────────────────────────────────
# 单个 API 覆盖多家，比 28 个易碎的 RSS 更可靠，这才是主力信号。

catch_all:
  - id: openrouter_models
    url: https://openrouter.ai/api/v1/models
    covers: 多数已配置公司
    auth: none
    notes: ⚠️ 过滤 `~` 前缀的浮动别名和 `:free`/`:extended` 变体后缀。

  - id: huggingface_org
    url_template: https://huggingface.co/api/models?author={org}&sort=createdAt&direction=-1&limit=20
    covers: 全部开源权重厂商，含 OpenRouter 缺的 5 家
    auth: none
    notes: >-
      ⚠️ author 参数大小写敏感，写错静默返回 []。
      规范 slug 可用 huggingface.co/api/organizations/{任意大小写}/overview 查（该接口不敏感）。
      需过滤量化/导出仓库噪声：GGUF|AWQ|GPTQ|FP8|INT4|W4A16|eagle|draft|ExecuTorch|MLX|onnx

  - id: hf_blog
    url: https://huggingface.co/blog/feed.xml
    auth: none

  - id: simonwillison
    url: https://simonwillison.net/atom/everything/
    auth: none
    notes: 高信号的人工策展，能补上没有 feed 的前沿发布。
