    homepage: https://deepmind.google
    blog: https://deepmind.google/blog/
    rss: https://deepmind.google/blog/rss.xml     # 最佳信号，Gemini 发布都在这
    rss_extra:
      - https://blog.google/rss/
      - https://developers.googleblog.com/feed/
    hf_org: google
    hf_org_extra: [deepmind]                     # google-deepmind 是 404，别用
    api_docs: https://ai.google.dev/gemini-api/docs/models
    changelog: https://ai.google.dev/gemini-api/docs/changelog
    pricing_page: https://ai.google.dev/gemini-api/docs/pricing
    pricing_md: null                             # 加 .md 返回的还是 HTML
    pricing_machine_readable: server_html
    openrouter_prefixes: [google]
    notes: 定价页服务端渲染，价格确在 HTML 字节里；页面无任何机器可读价格文件。

