# 33 家公司的追踪源清单
#
# 用途：(1) 定期发现新模型发布  (2) 记录各家官方定价页出处
#
# 字段说明
#   company     必须与 raw.csv 的 Company 列**完全一致**，这是关联键
#   rss         已实测可用的 feed。null = 已确认不存在，不必再排查
#   hf_org      HuggingFace 组织 slug。★ 大小写敏感 ★ 写错会静默返回空列表
#   pricing_machine_readable
#               official_md = 官方 markdown 表格（最稳）
#               server_html = 服务端渲染 HTML，可抓但每年要修选择器
#               js_spa      = 前端渲染，需无头浏览器，不建议做
#               none        = 不售卖推理服务 / 未找到定价页
#
# 全部条目于 2026-08-12 实测。⚠️ 标记的是会让脚本静默出错的坑。

companies:
  # ── 美国 / 欧洲 ────────────────────────────────────────────

  - company: OpenAI
    homepage: https://openai.com
    blog: https://openai.com/news/
    rss: https://openai.com/news/rss.xml
    hf_org: openai
    api_docs: https://platform.openai.com/docs/models
    changelog: https://platform.openai.com/docs/changelog
    pricing_page: https://platform.openai.com/docs/pricing
    pricing_md: https://platform.openai.com/docs/pricing.md
    pricing_machine_readable: official_md
    openrouter_prefixes: [openai]
    notes: >-
      pricing.md 会 301 跳到 developers.openai.com/api/docs/pricing.md。
      openai.com/api/pricing/ 是 Cloudflare 403，别用。HF org 无前沿权重。

  - company: Anthropic
    homepage: https://www.anthropic.com
    blog: https://www.anthropic.com/news
    rss: null            # ⚠️ 已确认无 RSS：/rss.xml /news/rss.xml /feed.xml 均 404
    hf_org: null         # ⚠️ Anthropic org 存在但 numModels=0，对发布监测无用
    api_docs: https://platform.claude.com/docs/en/api/models-list
    changelog: https://platform.claude.com/docs/en/release-notes/api
    pricing_page: https://www.anthropic.com/pricing
    pricing_md: https://platform.claude.com/docs/en/about-claude/pricing.md
    pricing_machine_readable: official_md
    openrouter_prefixes: [anthropic]
    notes: >-
      docs.claude.com 会 302 到 platform.claude.com。models-list 接口返回
      max_input_tokens/max_tokens 但**不含任何价格字段**。

