# 可自行直连的价格 API（Tier 2/3）
#
# 这些都是**根源 API**——我们直接调用服务方自己的接口，不经过任何中间聚合站。
# models.dev 挂掉不影响这里任何一条。
#
# ⚠️ unit 字段绝不能猜。每一项都用「已知官方价做锚」实测确定：
#    拿 Claude Sonnet(≈$3/1M)、Qwen3-32B(≈$0.1/1M) 等去比对，
#    看原始值 ×1 还是 ×1e6 更接近真实价。猜错就是 1000 倍的静默错误。
#
# 字段路径用点号表示嵌套；nested_list 表示价格在一个数组里（每个托管方一条）。

apis:
  - id: openrouter
    name: OpenRouter
    url: https://openrouter.ai/api/v1/models
    weblink: https://openrouter.ai/models
    # 免费额度层的落地页：`{id}` 用**剥后缀前**的原始 id 填充，
    # 这样链接直接指向该模型的免费变体页面
    model_url_template: https://openrouter.ai/{id}
    list_path: data
    id_fields: [id, canonical_slug, hugging_face_id]
    unit: per_token
    tier: 3
    fields:
      input_per_1m: pricing.prompt
      output_per_1m: pricing.completion
      cache_read_per_1m: pricing.input_cache_read
      context_length: context_length
    # ⚠️ 不要映射 pricing.image 到 per_image：实测 OpenRouter 的 `image` 字段
    #    与 `prompt` 同值同量级（gemini-2.5-pro 两者都是 0.00000125），
    #    是**图像输入 token 的每 token 价**，不是"每张图多少钱"。
    #    当成按张价会产出 1e-6 量级的假 per_image，且不参与单位换算。
    # `~` 前缀是浮动别名，`:free`/`:extended` 是同一模型的变体后缀
    skip_id_prefixes: ["~"]

  - id: deepinfra
    name: DeepInfra
    url: https://api.deepinfra.com/models/list
    weblink: https://deepinfra.com/models
    id_fields: [model_name]
    unit: cents_per_token          # 注意是「美分/token」，换算要 ×1e6÷100
    # 按张/按秒价同样以美分计：cents_per_image_unit=2.5 表示 $0.025/张。
    # 不声明就会得到 100 倍高价，而 2.5 本身看不出异常。
    flat_unit: cents
    tier: 3
    fields:
      input_per_1m: pricing.cents_per_input_token
      output_per_1m: pricing.cents_per_output_token
      context_length: max_tokens
      # 文生图按「图像单元」计价（默认 1024x1024 / 25 步为一个单元）
      per_image: pricing.cents_per_image_unit
      # 文生视频按输出秒计价
      per_second: pricing.cents_per_output_sec
    skip_if_true: [deprecated, private]

  - id: hf_router
    name: HuggingFace Router
    url: https://router.huggingface.co/v1/models
    weblink: https://huggingface.co/models?inference_provider=all
    list_path: data
    id_fields: [id]
    nested_list: providers          # 每个模型下挂多个托管方，各有各的价
    unit: per_1m
    tier: 3
    fields:
      input_per_1m: pricing.input
      output_per_1m: pricing.output
      context_length: context_length

  - id: vercel
    name: Vercel AI Gateway
    url: https://ai-gateway.vercel.sh/v1/models
    weblink: https://vercel.com/ai-gateway/models
    list_path: data
    id_fields: [id, name]
    unit: per_token
    tier: 3
    fields:
      input_per_1m: pricing.input
      output_per_1m: pricing.output
      # ⚠️ 与 OpenRouter 的同名字段不同义。实测锚点：
      #    seedream-5.0-lite 只有 image=0.035，与官方 ¥0.035/张 一致；
      #    纯文本模型（gpt-5 / gemini-2.5-pro / claude-sonnet-4.5）根本
      #    没有 image 字段——不存在 OpenRouter 那种"图像输入 token 价"污染。
      per_image: pricing.image

  - id: pioneer
    name: Pioneer
    url: https://api.pioneer.ai/v1/models
    weblink: https://pioneer.ai
    list_path: data
    id_fields: [id]
    unit: per_1m
    tier: 3
    fields:
      input_per_1m: input_price_per_million
      output_per_1m: output_price_per_million
      cache_read_per_1m: cache_read_price_per_million
      cache_write_per_1m: cache_write_price_per_million

  - id: ofox
    name: ofox
    url: https://api.ofox.ai/v2/models/catalog?include=provider_price&limit=1000
    weblink: https://ofox.ai
    list_path: data
    id_fields: [id]
    unit: per_token
    tier: 3
    fields:
      input_per_1m: pricing.input
      output_per_1m: pricing.output
      per_second: pricing.output_video_per_second
      # 字段名自带单位语义（per_num = 每张），无歧义。
      # 锚点：doubao-seedream-5.0-pro=0.05、qwen-image-3.0=0.03，
      # 与各自官方牌价同量级。
      per_image: pricing.output_image_per_num

  - id: empiriolabs
    name: Empirio Labs
    url: https://api.empiriolabs.ai/v1/models
    weblink: https://empiriolabs.ai
    list_path: data
    id_fields: [id]
    unit: per_token
    tier: 3
    fields:
      input_per_1m: pricing.prompt
      output_per_1m: pricing.completion
      cache_read_per_1m: pricing.input_cache_read
      # ⚠️ 与 OpenRouter 同名不同义：Empirio 的 `image` 确实是**每张**美元
      #    （seedream-lite=0.035、gpt-image-2=0.012，都是真实刀数量级），
      #    而 OpenRouter 的 `image` 是每 token 价。同名字段必须逐源实测。
      per_image: pricing.image

  - id: ovhcloud
    name: OVHcloud AI Endpoints
    url: https://catalog.endpoints.ai.ovh.net/rest/v2/openrouter
    weblink: https://endpoints.ai.cloud.ovh.net
    list_path: data
    id_fields: [id, name]
    unit: per_token
    tier: 3
    fields:
      input_per_1m: pricing.prompt
      output_per_1m: pricing.completion

  - id: chutes
    name: Chutes
    url: https://llm.chutes.ai/v1/models
    weblink: https://chutes.ai
    list_path: data
    id_fields: [id]
    unit: per_1m
    tier: 3
    fields:
      input_per_1m: pricing.prompt
      output_per_1m: pricing.completion
      cache_read_per_1m: pricing.input_cache_read

  - id: tinfoil
    name: Tinfoil
    url: https://inference.tinfoil.sh/v1/models
    weblink: https://tinfoil.sh
    list_path: data
    id_fields: [id, name]
    unit: per_1m
    tier: 3
    fields:
      input_per_1m: pricing.inputTokenPricePer1M
      output_per_1m: pricing.outputTokenPricePer1M
      cache_read_per_1m: pricing.cachedInputTokenPricePer1M

  # ⚠️ cortecs 报价是**欧元**。保留但标注币种，导出选价时只用 USD，
  #    把欧元当美元用是实打实的错误，不是舍入误差。
  - id: cortecs
    name: Cortecs
    url: https://api.cortecs.ai/v1/models
    weblink: https://cortecs.ai
    list_path: data
    id_fields: [id]
    unit: per_1m
    currency: EUR
    tier: 3
    fields:
      input_per_1m: pricing.input_token
      output_per_1m: pricing.output_token
      cache_read_per_1m: pricing.cache_read_cost

  - id: requesty
    name: Requesty
    url: https://router.requesty.ai/v1/models/managed
    weblink: https://requesty.ai
    list_path: data
    id_fields: [id]
    unit: per_token
    tier: 3
    fields:
      input_per_1m: input_price
      output_per_1m: output_price
      cache_read_per_1m: cached_price
      cache_write_per_1m: caching_price
