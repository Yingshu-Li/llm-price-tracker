# 人工确认过的模型名映射。优先级最高，一旦写在这里就永久生效。
#
# 工作流：
#   1. 跑 `python update_prices.py`
#   2. 打开 out/unmatched.csv，里面是自动匹配失败的模型 + 相似度候选
#   3. 确认无误的写到下面，格式：
#
#        aliases:
#          "<raw.csv 里的 Model 原值>":
#            <源 id>: <该源里的模型 id>
#
#   4. 重跑，这些就会以 method=alias、confidence=1.0 命中
#
# ⚠️ 只在你确认两者**确实是同一个模型**时才写。相似度高不等于同一个模型：
#    `GPT-5.6 Sol Pro` 与 `gpt-5.6-sol` 相似度 0.846，但它们是不同的模型，
#    官方定价表里根本没有 sol-pro，正确处理是留空而不是硬套一个价格。
#
# 示例（注释掉的，按需取用）：
#   aliases:
#     "GPT-5.5 Thinking":
#       openai_md: gpt-5.5
#     "Spark Pro / generalv3":
#       iflytek_html: generalv3

aliases:
  "Spark 4.0 Ultra / 4.0Ultra":
    ai302_html: 4.0Ultra
  "Spark Lite / lite":
    ai302_html: general
  "Spark-X2 / model=spark-x":
    iflytek_maas_api: xsparkx2
  "Spark-X2 / xsparkx2":
    iflytek_maas_api: xsparkx2
  "Spark-X2-Flash / xsparkx2flash":
    iflytek_maas_api: xsparkx2flash
  "Amazon Nova Multimodal Embeddings":
    litellm: amazon.nova-2-multimodal-embeddings-v1:0

  # ── 图像生成 ──
  # raw.csv 用不带版本号的名字，上游只发布带版本号的 id。
  # 核对依据：litellm 的 imagen-4.0-generate-001 = $0.04/张，与 Google 官方
  # Imagen 4 标准档 $0.04 一致（Fast $0.02 / Ultra $0.06 是另外两个型号，
  # 已分别对应 -fast- / -ultra- 的 id，不能混用）。
  "imagen-4.0-generate":
    litellm: imagen-4.0-generate-001

  # MAI-Image-2e 的 e = Efficient。核对依据：litellm 里该条
  # input_cost_per_token=5e-06（即 $5/1M 文本输入），与微软 Foundry 公布的
  # MAI-Image-2-Efficient 口径一致；同源的 MAI-Image-2.5 / 2.5-Flash 是
  # 更新的独立型号，**不是**本模型的别名。
  "MAI-Image-2-Efficient":
    litellm: MAI-Image-2e

  # ⚠️ 下面几条给的是**已经有匹配**的模型，必须把该模型当前命中的源**全部**
  #    列出来：命中别名后 match_all 会直接 continue，跳过 exact/contains，
  #    漏写一个源就等于把那家的报价删掉（quote_count 会悄悄少一个）。

  # DeepInfra 用简称 sd3.5 / sd3.5-medium，与 raw.csv 的全称对不上。
  # 核对依据：DeepInfra 目录里 `stabilityai/sd3.5` 的描述是「At 8 billion
  # parameters…the most powerful in the Stable Diffusion family」= 3.5 Large；
  # `sd3.5-medium` 是「At 2.5 billion parameters…MMDiT-X」= 3.5 Medium。
  # 两者按张价 $0.06 / $0.03，与参数量级次序一致。
  "stabilityai/stable-diffusion-3.5-large":
    deepinfra: stabilityai/sd3.5
    modelsdev: stable-diffusion-3.5-large
  "stabilityai/stable-diffusion-3.5-medium":
    deepinfra: stabilityai/sd3.5-medium

  # 同一个模型两边词序相反（`FLUX-1.1-pro` vs `flux-pro-1.1`），规范化救不了。
  # 核对依据：DeepInfra 该条描述为「Black Forest Labs' latest state-of-the art
  # proprietary model」，按张价 $0.04，与 Vercel 的 bfl/flux-pro-1.1 同价。
  # ⚠️ bfl_official 这一行是后加的：BFL 官方源上线后，若不列进来，
  #    别名的短路会让**官方价**匹配不上（实测 flux-pro-1.1 因此拿不到
  #    官方 $0.04，而同族没有别名的 flux-kontext-pro 拿到了）。
  #    这正是本段开头那条「必须把源列全」的注意事项。
  "flux-pro-1.1":
    deepinfra: black-forest-labs/FLUX-1.1-pro
    vercel: bfl/flux-pro-1.1
    bfl_official: flux-pro-1.1

  # raw.csv 写 HF 路径，Empirio Labs 用短 id。核对依据：该条描述为
  # 「Open-source text-to-image model on a multimodal Mixture-of-Experts
  # architecture」，正是混元 3.0 的架构；按张价 $0.13。
  "tencent/HunyuanImage-3.0":
    empiriolabs: hunyuan-image-3

  # ── 视频生成：DashScope 官方 id 不带 Vercel 的 `alibaba/` 与 `-v` 写法 ──
  "alibaba/wan-v2.5-t2v-preview":
    alibaba_video_official_verified: wan2.5-t2v-preview
    vercel: alibaba/wan-v2.5-t2v-preview
  "alibaba/wan-v2.6-t2v":
    alibaba_video_official_verified: wan2.6-t2v
    vercel: alibaba/wan-v2.6-t2v
  "alibaba/wan-v2.6-i2v":
    alibaba_video_official_verified: wan2.6-i2v
    vercel: alibaba/wan-v2.6-i2v
  "alibaba/wan-v2.6-i2v-flash":
    alibaba_video_official_verified: wan2.6-i2v-flash
    vercel: alibaba/wan-v2.6-i2v-flash
  "alibaba/wan-v2.7-t2v":
    alibaba_video_official_verified: wan2.7-t2v
    vercel: alibaba/wan-v2.7-t2v
  "alibaba/wan-v2.7-i2v":
    alibaba_video_official_verified: wan2.7-i2v
    vercel: alibaba/wan-v2.7-i2v

  # Gemini API 仍使用 preview id；Vercel 目录把同一在售版本写成稳定 `-001`。
  "gemini-omni-1.1-flash":
    google_omni_video_official_verified: gemini-omni-1.1-flash
    fal_google_video_verified: google/gemini-omni-flash/v1.1/text-to-video
    runway_google_video_verified: gemini_omni_flash
  "veo-3.1-generate-preview":
    google_video_official_verified: veo-3.1-generate-preview
    litellm: veo-3.1-generate-preview
    vercel: google/veo-3.1-generate-001
  "veo-3.1-fast-generate-preview":
    google_video_official_verified: veo-3.1-fast-generate-preview
    litellm: veo-3.1-fast-generate-preview
    vercel: google/veo-3.1-fast-generate-001
  "veo-3.1-lite-generate-preview":
    google_video_official_verified: veo-3.1-lite-generate-preview
    litellm: veo-3.1-lite-generate-preview
    vercel: google/veo-3.1-lite-generate-001

# ── 人工排除的规范化候选名 ──────────────────────────────────────
# name_candidates() 剥版本后缀后，同族不同代会塌成同一个名字。
# 这里逐例把**歧义的那个候选形式**从匹配中拿掉，精确形式仍然可用。
#
# ⚠️ 不要改成「歧义就自动排除」：全库有 57 个歧义候选，绝大多数是
#    有意的双行约定（GLM-4.6 的 API 行与 zai-org/GLM-4.6 的开源行是
#    同一个模型，共享价格是对的），自动排除会抹掉几十行真价格。
exclude_candidates:
  # DeepInfra 只托管 whisper-large-v3（$0.00045/分钟）。剥掉 `-vN` 后
  # v1、v2 也命中 `whisper-large`，凭空拿到 v3 的价——它们是 2022/2023 年
  # 的历史模型，没有任何厂商在售。v3 自身走精确形式，不受影响。
  "whisper-large-v1":
    - whisper-large
  "whisper-large-v2":
    - whisper-large
