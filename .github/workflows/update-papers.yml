name: 更新论文雷达

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查 70 个来源并补全缺失元数据
        run: python update_papers.py

      - name: 提交论文产物
        run: |
          set -euo pipefail
          git add out/papers.json out/papers.csv out/papers_state.json

          if git diff --cached --quiet; then
            echo "论文数据无变化，跳过提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新论文雷达 ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 上传论文数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-paper-radar
          path: |
            out/papers.json
            out/papers.csv
            out/papers_state.json
          retention-days: 14

